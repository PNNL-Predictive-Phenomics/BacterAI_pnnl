name: bacterai
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - optuna
  - torch
  - pydoe3
  - gpytorch
  - openpyxl
  - r-base>=4.3
  - r-randomforest
  - r-tibble
  - r-moments
